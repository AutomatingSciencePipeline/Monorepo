apiVersion: apps/v1
kind: Deployment
metadata:
  name: glados-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        glados-component: backend
    spec:
      serviceAccountName: glados-backend
      containers:
      - name: backend
        image: backend
        ports:
        - containerPort: 5050
        env:
        - name: IMAGE_RUNNER
          value: runner
        - name: BACKEND_PORT
          valueFrom:
            secretKeyRef:
              name: secret-env
              key: BACKEND_PORT
        - name: MONGODB_PORT
          valueFrom:
            secretKeyRef:
              name: secret-env
              key: MONGODB_PORT
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: secret-env
              key: MONGODB_USERNAME
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-env
              key: MONGODB_PASSWORD
        # Used to send "experiment finished" emails. Runner Pods no longer receive this.
        - name: GMAIL_CREDS
          valueFrom:
            secretKeyRef:
              name: secret-env
              key: GMAIL_CREDS
              optional: true
