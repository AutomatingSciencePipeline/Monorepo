# One identity per component, so each one only gets the permissions it needs.
# Nothing is bound to the namespace's "default" ServiceAccount anymore.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glados-backend
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glados-frontend
  namespace: default
---
# Runner Pods execute user-submitted code. This account has no RBAC bindings at all,
# and its token is not mounted into the Pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glados-runner
  namespace: default
automountServiceAccountToken: false
