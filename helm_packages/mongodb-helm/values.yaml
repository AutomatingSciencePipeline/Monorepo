# values.yaml
architecture: replicaset

image: 
  registry: docker.io 
  repository: bitnamilegacy/mongodb 
  tag: 8.0.13

replicaSet:
  enabled: true
  replicas: 3 # Set the number of replicas
  waitForPrimary: true

persistence:
  enabled: true
  storageClass: local-storage # Use the storage class created earlier
  accessModes:
    - ReadWriteOnce
  size: 10Gi # Adjust the size as needed

auth:
  enabled: true
  rootUser: "adminuser"
  # The password is not stored in this repository. deploy.sh creates this Secret, with the keys
  # mongodb-root-password and mongodb-replica-set-key. The password must match MONGODB_PASSWORD
  # in the secret-env Secret that the frontend and backend read.
  existingSecret: glados-mongodb-auth

service:
  nameOverride: glados-service-mongodb

externalAccess:
  enabled: true
  service:
    type: NodePort
    nodePorts: [30000, 30001]

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "kubernetes.io/hostname"  # Key for the node selector
              operator: In
              values:
                - "glados-db"  # Replace with the name of the node you want to use
