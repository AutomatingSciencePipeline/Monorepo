name: Python Lint and Test - MCP Facade

on:
  push:
    paths:
      - 'apps/mcp-facade/**'
    branches: [ main ]
  pull_request:
    paths:
      - 'apps/mcp-facade/**'
    branches: [ main ]

permissions:
  contents: read

jobs:
  Lint_And_Test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      working-directory: ./apps/mcp-facade
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev --system --deploy --ignore-pipfile
    - name: Analyze facade with pylint
      working-directory: ./apps/mcp-facade
      # Fail if any Error-level notices were produced or the score is below 9.0
      run: pylint --fail-on=E --fail-under=9.0 --recursive=y glados_mcp tests
    - name: Test facade with pytest + record coverage
      working-directory: ./apps/mcp-facade
      run: bash coverage.sh
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report-mcp-facade
        path: ./apps/mcp-facade/coverageReport/
