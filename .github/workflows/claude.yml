# Lets anyone with write access mention @claude in an issue or PR comment to ask questions or request changes.
# Docs: https://code.claude.com/docs/en/github-actions
#
# Requires the ANTHROPIC_API_KEY repository secret and the Claude GitHub App installed on this repo.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
