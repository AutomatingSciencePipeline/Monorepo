name: Google authentication regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/google-auth-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/google-auth-test.yml'

permissions:
  contents: read

jobs:
  google-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0.13
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:google-auth
        env:
          GLADOS_AUTH_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/
